[package]
name = "ironcalc_server"
version = "0.9.1"
edition = "2021"

[dependencies]
rocket = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ironcalc = { path = "../../../xlsx/", features = ["pdf"] }
ironcalc_pdf = { path = "../../../pdf", features = ["serde"] }

[dependencies.rocket_db_pools]
version = "0.2.0"
features = ["sqlx_sqlite"]

