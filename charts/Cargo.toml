[package]
name = "ironcharts"
version = "0.9.1"
authors = ["Nicolás Hatcher <nicolas@theuniverse.today>"]
edition = "2021"
homepage = "https://www.ironcalc.com"
repository = "https://github.com/ironcalc/ironcalc/"
description = "IronCharts: lays out IronCalc charts as pictures"
license = "MIT OR Apache-2.0"

[dependencies]
# Uses `../base` when used locally, and the indicated version from crates.io
# when published.
ironcalc_base = { path = "../base", version = "0.9" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
# For the `render` example, which reads charts from xlsx files
ironcalc = { path = "../xlsx", version = "0.9" }
