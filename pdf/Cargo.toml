[package]
name = "ironcalc_pdf"
version = "0.1.0"
edition = "2021"
authors = ["Nicolás Hatcher <nicolas@theuniverse.today>", "IronCalc Contributors"]
description = "PDF export for IronCalc spreadsheet engine"
license = "MIT OR Apache-2.0"

[dependencies]
ironcalc_base = { path = "../base", version = "0.9" }
hipdf = "1.3.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
chrono = "0.4"

[dev-dependencies]
ironcalc = { path = "../xlsx", default-features = false }
serde_json = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]
