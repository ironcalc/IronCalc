name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust tests (base + xlsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Test ironcalc_base
        run: cargo test -p ironcalc_base --lib
      - name: Check ironcalc (xlsx)
        run: cargo check -p ironcalc
