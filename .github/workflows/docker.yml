name: Publish docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/ironcalc/ironcalc-server
  CADDY_IMAGE: ghcr.io/ironcalc/ironcalc-caddy

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: ${{ github.ref_type != 'tag' }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image by digest
        id: build-server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server-runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push caddy image by digest
        id: build-caddy
        uses: docker/build-push-action@v7
        with:
          context: .
          target: caddy-runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.CADDY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        run: |
          mkdir -p "${{ runner.temp }}/digests/server" "${{ runner.temp }}/digests/caddy"
          server_digest="${{ steps.build-server.outputs.digest }}"
          caddy_digest="${{ steps.build-caddy.outputs.digest }}"
          touch "${{ runner.temp }}/digests/server/${server_digest#sha256:}"
          touch "${{ runner.temp }}/digests/caddy/${caddy_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    name: Create multi-arch manifests
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push manifests
        run: |
          docker buildx imagetools create -t "$SERVER_IMAGE:${{ steps.v.outputs.version }}" \
            $(printf "$SERVER_IMAGE@sha256:%s " $(ls digests/server))
          docker buildx imagetools create -t "$CADDY_IMAGE:${{ steps.v.outputs.version }}" \
            $(printf "$CADDY_IMAGE@sha256:%s " $(ls digests/caddy))

      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect "$SERVER_IMAGE:${{ steps.v.outputs.version }}"
          docker buildx imagetools inspect "$CADDY_IMAGE:${{ steps.v.outputs.version }}"
