name: Publish docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push ghcr images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: ${{ github.ref_type != 'tag' }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build images
        run: |
          docker build --target server-runtime -t ghcr.io/ironcalc/ironcalc-server:${{ steps.v.outputs.version }} .
          docker build --target caddy-runtime -t ghcr.io/ironcalc/ironcalc-caddy:${{ steps.v.outputs.version }} .

      - name: Push images
        run: |
          docker push ghcr.io/ironcalc/ironcalc-server:${{ steps.v.outputs.version }}
          docker push ghcr.io/ironcalc/ironcalc-caddy:${{ steps.v.outputs.version }}
