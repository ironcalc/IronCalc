[package]
name = "pyroncalc"
version = "0.8.2"
edition = "2021"


[lib]
name = "_ironcalc"
crate-type = ["cdylib"]


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xlsx = { package= "ironcalc", path = "../../xlsx", version = "0.8.2" }
pyo3 = { version = "0.27.2", features = ["extension-module"] }
pythonize = "0.27"
bitcode = "0.6.8"


[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[build-dependencies]
pyo3-build-config = "0.27.2"
